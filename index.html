// ─── PRODUCT CARD ─────────────────────────────────────────────
function ProductCard({ producto, onAgregar, added, animDelay, skipAnim }) {
  const bgEmoji = C.cat[producto.categoria] || "#F0E0C5";
  const ref = React.useRef(null);

  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Si viene de un filtro activo, mostramos sin esperar observer
    if (skipAnim) { el.classList.add("visible"); return; }
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add("visible"); obs.disconnect(); }
    }, { threshold: 0.05 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [skipAnim]);

  return (
    <article
      ref={ref}
      className="card-animated"
      style={{
        background: "#fff",
        border: `1px solid ${C.borderSoft}`,
        borderRadius: 18,
        overflow: "hidden",
        display: "flex", flexDirection: "column",
        transition: "transform 0.28s cubic-bezier(.22,.68,0,1.2), box-shadow 0.28s ease",
        boxShadow: "0 2px 14px rgba(200,64,26,0.05)",
        cursor: "default",
        animationDelay: animDelay || "0s",
      }}
      onMouseEnter={e => {
        e.currentTarget.style.transform = "scale(1.025) translateY(-3px)";
        e.currentTarget.style.boxShadow = "0 16px 44px rgba(200,64,26,0.16)";
      }}
      onMouseLeave={e => {
        e.currentTarget.style.transform = "scale(1) translateY(0)";
        e.currentTarget.style.boxShadow = "0 2px 14px rgba(200,64,26,0.05)";
      }}
    >
      {/* Área imagen */}
      <div style={{
        height: 160, background: bgEmoji,
        display: "flex", alignItems: "center", justifyContent: "center",
        position: "relative", fontSize: 52, overflow: "hidden",
      }}>
        {producto.foto
          ? <img src={producto.foto} alt={producto.nombre} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} loading="lazy" />
          : producto.emoji
        }
        {/* Gradient overlay sutil */}
        <div style={{
          position: "absolute", inset: 0, pointerEvents: "none",
          background: "linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.22) 100%)",
        }} />
        {/* Badge especial */}
        {producto.badge && (
          <span style={{
            position: "absolute", top: 9, left: 9,
            background: C.primary, color: "#fff",
            borderRadius: 999, padding: "3px 10px",
            fontSize: 11, fontWeight: 700,
            boxShadow: "0 2px 8px rgba(200,64,26,0.3)",
          }}>{producto.badge}</span>
        )}
        {/* Categoría abajo-derecha sobre el overlay */}
        <span style={{
          position: "absolute", bottom: 9, right: 9,
          background: "rgba(255,255,255,0.9)",
          borderRadius: 999, padding: "2px 8px",
          fontSize: 10, fontWeight: 700, color: C.ink2,
        }}>{producto.categoria}</span>
      </div>

      {/* Cuerpo */}
      <div style={{ padding: "14px 14px 6px", flex: 1 }}>
        <h3 className="card-name" style={{
          fontFamily: "'Playfair Display', Georgia, serif",
          fontWeight: 700, fontSize: 15, color: C.ink,
          lineHeight: 1.25, marginBottom: 5,
        }}>{producto.nombre}</h3>
        <p className="card-desc" style={{
          fontSize: 12, color: C.ink2, lineHeight: 1.45,
          display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden",
        }}>{producto.descripcion}</p>
      </div>

      {/* Footer: precio + botón full-width */}
      <div style={{ padding: "10px 14px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
        <span className="card-price" style={{ fontWeight: 900, fontSize: 20, color: C.primary, letterSpacing: "-0.02em" }}>
          {fmt(producto.precio)}
        </span>
        <button
          onClick={() => onAgregar(producto)}
          aria-label={`Agregar ${producto.nombre} al pedido`}
          style={{
            width: "100%", padding: "10px 0", borderRadius: 12,
            background: added ? "#28A745" : C.primary,
            color: "#fff", fontWeight: 700, fontSize: 14,
            transition: "all 0.25s",
            animation: added ? "pop 0.3s ease" : "none",
            letterSpacing: "0.01em",
          }}
          onMouseEnter={e => { if (!added) { e.currentTarget.style.background = C.primaryDark; e.currentTarget.style.transform = "scale(1.02)"; }}}
          onMouseLeave={e => { e.currentTarget.style.background = added ? "#28A745" : C.primary; e.currentTarget.style.transform = "scale(1)"; }}
        >{added ? "✓ Agregado" : "+ Agregar"}</button>
      </div>
    </article>
  );
}

// ─── GRID DE MENÚ ─────────────────────────────────────────────
function MenuGrid({ carrito, onAgregar }) {
  const [activa, setActiva] = useState("Todas");
  const [added, setAdded] = useState({});
  const [busqueda, setBusqueda] = useState("");

  // Si hay filtro activo (categoría ≠ Todas o hay búsqueda), skip la animación scroll
  const hayFiltro = activa !== "Todas" || busqueda.length > 0;

  const filtrados = PRODUCTOS.filter(p => {
    const matchCat = activa === "Todas" || p.categoria === activa;
    const q = busqueda.toLowerCase();
    const matchSearch = !q ||
      p.nombre.toLowerCase().includes(q) ||
      p.descripcion.toLowerCase().includes(q) ||
      p.categoria.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  // Al cambiar categoría, limpiamos la búsqueda para evitar resultados vacíos confusos
  const handleCategoria = (cat) => {
    setActiva(cat);
    setBusqueda("");
  };

  const handleAgregar = (prod) => {
    onAgregar(prod);
    setAdded(a => ({ ...a, [prod.id]: true }));
    setTimeout(() => setAdded(a => ({ ...a, [prod.id]: false })), 1400);
  };

  return (
    <div>
      <CatFilter activa={activa} onChange={handleCategoria} busqueda={busqueda} onBusqueda={setBusqueda} />
      <section id="menu" style={{ maxWidth: 1160, margin: "0 auto", padding: "48px 20px 60px" }}>
        <h2 style={{
          fontFamily: "'Playfair Display', Georgia, serif",
          fontSize: "clamp(1.8rem, 4vw, 2.8rem)", color: C.ink, marginBottom: 8,
        }}>Nuestro Menú</h2>
        <p style={{ color: C.ink2, marginBottom: 36, fontSize: 15 }}>
          Todo hecho en casa · {filtrados.length} producto{filtrados.length !== 1 ? "s" : ""} disponible{filtrados.length !== 1 ? "s" : ""}
        </p>
        <div
          className="menu-grid"
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))",
            gap: 20,
          }}
        >
          {filtrados.map((p, i) => (
            <ProductCard
              key={p.id}
              producto={p}
              onAgregar={handleAgregar}
              added={!!added[p.id]}
              animDelay={hayFiltro ? "0s" : `${(i % 4) * 0.07}s`}
              skipAnim={hayFiltro}
            />
          ))}
          {filtrados.length === 0 && (
            <div style={{
              gridColumn: "1 / -1", textAlign: "center",
              padding: "64px 20px", color: C.ink2,
            }}>
              <span style={{ fontSize: 52, display: "block", marginBottom: 14 }}>🔍</span>
              <p style={{ fontWeight: 700, fontSize: 17, color: C.ink, marginBottom: 8 }}>
                Sin resultados para "{busqueda}"
              </p>
              <p style={{ fontSize: 14 }}>Probá con otro término o explorá el menú completo.</p>
              <button
                onClick={() => { setBusqueda(""); setActiva("Todas"); }}
                style={{
                  marginTop: 16, padding: "9px 22px", borderRadius: 999,
                  background: C.primary, color: "#fff", fontWeight: 700, fontSize: 14,
                }}
              >Ver todo el menú</button>
            </div>
          )}
        </div>
      </section>
    </div>
  );
}

const { useState, useCallback } = React;

function App() {
  const [carrito, setCarrito]           = useState([]);
  const [carritoAbierto, setCarritoAbierto] = useState(false);

  // Agregar al carrito
  const agregarAlCarrito = useCallback((producto) => {
    setCarrito(prev => {
      const existe = prev.find(i => i.id === producto.id);
      if (existe) {
        return prev.map(i => i.id === producto.id ? { ...i, cantidad: i.cantidad + 1 } : i);
      }
      return [...prev, { ...producto, cantidad: 1 }];
    });
  }, []);

  // Quitar / reducir cantidad
  const quitarDelCarrito = useCallback((id) => {
    setCarrito(prev => {
      const item = prev.find(i => i.id === id);
      if (!item) return prev;
      if (item.cantidad === 1) return prev.filter(i => i.id !== id);
      return prev.map(i => i.id === id ? { ...i, cantidad: i.cantidad - 1 } : i);
    });
  }, []);

  // Vaciar
  const vaciarCarrito = useCallback(() => {
    if (window.confirm("¿Vaciás el carrito?")) setCarrito([]);
  }, []);

  const totalItems = carrito.reduce((s, i) => s + i.cantidad, 0);

  const irAlMenu = () => {
    const el = document.getElementById("menu");
    if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: "smooth" });
  };

  return (
    <>
      <Navbar
        cartCount={totalItems}
        onCartOpen={() => setCarritoAbierto(true)}
      />

      <main>
        <Hero onMenuClick={irAlMenu} />
        <MenuGrid carrito={carrito} onAgregar={agregarAlCarrito} />
        <ComoPedimos />
        <Nosotros />
        <PedidosEspeciales />
      </main>

      <Footer />

      {carritoAbierto && (
        <CartDrawer
          carrito={carrito}
          onClose={() => setCarritoAbierto(false)}
          onAgregar={agregarAlCarrito}
          onQuitar={quitarDelCarrito}
          onVaciar={vaciarCarrito}
        />
      )}

      <WaFab />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
